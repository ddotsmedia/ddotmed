name: medicore_mobile
description: MediCore HMS mobile apps — doctor, nurse and patient flavours.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — BLoC only, no other state solution anywhere in this app.
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Offline-first storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Networking
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  # Device capabilities
  mobile_scanner: ^6.0.2
  camera: ^0.11.0+2
  record: ^5.2.0
  flutter_blue_plus: ^1.34.5
  geolocator: ^13.0.2

  # Telemedicine
  flutter_webrtc: ^0.12.5

  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/

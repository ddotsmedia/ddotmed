name: medicore-dev

services:
  postgres:
    # postgres:17 + pgvector (required by ai-service RAG search)
    image: pgvector/pgvector:pg17
    container_name: medicore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medicore
      POSTGRES_PASSWORD: medicore_dev
      POSTGRES_DB: medicore
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medicore -d medicore']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [medicore-network]

  redis:
    image: redis:8-alpine
    container_name: medicore-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [medicore-network]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: medicore-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [medicore-network]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: medicore-kafka
    restart: unless-stopped
    depends_on: [zookeeper]
    ports: ['9092:9092']
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:29092']
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [medicore-network]

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: medicore-fhir
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['8080:8080']
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi_fhir
      SPRING_DATASOURCE_USERNAME: medicore
      SPRING_DATASOURCE_PASSWORD: medicore_dev
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_ALLOW_MULTIPLE_DELETE: 'true'
      HAPI_FHIR_REUSE_CACHED_SEARCH_RESULTS_MILLIS: '60000'
    networks: [medicore-network]

  minio:
    image: minio/minio:latest
    container_name: medicore-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports: ['9000:9000', '9001:9001']
    environment:
      MINIO_ROOT_USER: medicore
      MINIO_ROOT_PASSWORD: medicore_dev_secret
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [medicore-network]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  medicore-network:
    driver: bridge

name: medicore

x-logging: &default-logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

x-restart: &restart
  restart: always

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg17
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }
    networks: [medicore-network]

  redis:
    <<: *restart
    image: redis:8-alpine
    logging: *default-logging
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }
    networks: [medicore-network]

  zookeeper:
    <<: *restart
    image: confluentinc/cp-zookeeper:7.6.0
    logging: *default-logging
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes: [zkdata:/var/lib/zookeeper/data]
    healthcheck:
      test: ['CMD-SHELL', 'echo ruok | nc -w 2 localhost 2181 | grep imok']
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
    networks: [medicore-network]

  kafka:
    <<: *restart
    image: confluentinc/cp-kafka:7.6.0
    logging: *default-logging
    depends_on:
      zookeeper: { condition: service_healthy }
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:29092']
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 2G }
    networks: [medicore-network]

  minio:
    <<: *restart
    image: minio/minio:latest
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }
    networks: [medicore-network]

  hapi-fhir:
    <<: *restart
    image: hapiproject/hapi:latest
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi_fhir
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
      HAPI_FHIR_FHIR_VERSION: R4
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8080/fhir/metadata > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 3G }
    networks: [medicore-network]

  core-api:
    <<: *restart
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    env_file: [/etc/medicore/.env]
    environment:
      NODE_ENV: production
      PORT: 4000
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }
    networks: [medicore-network]

  ai-service:
    <<: *restart
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    logging: *default-logging
    depends_on:
      postgres: { condition: service_healthy }
    env_file: [/etc/medicore/.env]
    environment:
      PORT: 8000
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request;urllib.request.urlopen(''http://localhost:8000/health'')"']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }
    networks: [medicore-network]

  web:
    <<: *restart
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: /ws
    logging: *default-logging
    depends_on:
      core-api: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health || exit 1']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 2G }
    networks: [medicore-network]

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    logging: *default-logging
    depends_on: [web, core-api, ai-service, hapi-fhir]
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
    networks: [medicore-network]

volumes:
  pgdata:
  redisdata:
  kafkadata:
  zkdata:
  miniodata:
  certbot-webroot:

networks:
  medicore-network:
    driver: bridge

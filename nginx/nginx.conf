user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 128m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/fhir+json application/atom+xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream web        { server web:3000;        keepalive 32; }
    upstream core_api   { server core-api:4000;   keepalive 32; }
    upstream ai_service { server ai-service:8000; keepalive 16; }
    upstream fhir       { server hapi-fhir:8080;  keepalive 16; }

    server {
        listen 80;
        listen [::]:80;
        server_name DOMAIN_PLACEHOLDER;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name DOMAIN_PLACEHOLDER;

        ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        limit_conn conn_zone 64;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location ~ ^/api/(auth|oauth|saml|mfa|break-glass) {
            limit_req zone=auth_zone burst=20 nodelay;
            proxy_pass http://core_api;
        }

        location /api/ {
            limit_req zone=general_zone burst=200 nodelay;
            proxy_pass http://core_api;
            proxy_read_timeout 120s;
        }

        location /ai/ {
            limit_req zone=general_zone burst=100 nodelay;
            proxy_pass http://ai_service/;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /fhir/ {
            limit_req zone=general_zone burst=100 nodelay;
            proxy_pass http://fhir/fhir/;
            proxy_read_timeout 120s;
        }

        location /ws {
            proxy_pass http://core_api;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /ai/scribe/stream {
            proxy_pass http://ai_service/scribe/stream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /_next/static/ {
            proxy_pass http://web;
            proxy_cache_valid 200 60m;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            limit_req zone=general_zone burst=200 nodelay;
            proxy_pass http://web;
        }
    }
}

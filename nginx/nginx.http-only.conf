# ─────────────────────────────────────────────────────────────────────────────
# INTERIM HTTP-ONLY CONFIGURATION — smoke-testing before a domain is assigned.
#
# Let's Encrypt does not issue certificates for bare IP addresses, so there is no
# way to serve HTTPS on 194.164.151.202 alone. Use this to confirm the stack is
# healthy, then point a domain at the server and switch to nginx.conf via
# infrastructure/certbot-setup.sh.
#
#   THIS SERVES TRAFFIC IN PLAINTEXT. Credentials, tokens and any PHI would cross
#   the network unencrypted. Do not put real patient data behind this config, and
#   do not leave it in place once a domain exists.
# ─────────────────────────────────────────────────────────────────────────────

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 128m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/fhir+json image/svg+xml;

    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream web        { server web:3000;        keepalive 32; }
    upstream core_api   { server core-api:4000;   keepalive 32; }
    upstream ai_service { server ai-service:8000; keepalive 16; }
    upstream fhir       { server hapi-fhir:8080;  keepalive 16; }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # HSTS is deliberately absent: sending it over plaintext would pin browsers
        # to HTTPS for a host that cannot yet serve it.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-MediCore-Warning "interim HTTP-only deployment; not for patient data" always;

        limit_conn conn_zone 64;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        location /.well-known/acme-challenge/ { root /var/www/certbot; }

        location ~ ^/api/(auth|oauth|saml|mfa|break-glass) {
            limit_req zone=auth_zone burst=20 nodelay;
            proxy_pass http://core_api;
        }

        location /api/ {
            limit_req zone=general_zone burst=200 nodelay;
            proxy_pass http://core_api;
            proxy_read_timeout 120s;
        }

        location /ai/ {
            limit_req zone=general_zone burst=100 nodelay;
            proxy_pass http://ai_service/;
            proxy_read_timeout 300s;
        }

        location /fhir/ {
            limit_req zone=general_zone burst=100 nodelay;
            proxy_pass http://fhir/fhir/;
            proxy_read_timeout 120s;
        }

        location /ws {
            proxy_pass http://core_api;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location / {
            limit_req zone=general_zone burst=200 nodelay;
            proxy_pass http://web;
        }
    }
}

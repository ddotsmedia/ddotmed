[project]
name = "medicore-ai-service"
version = "1.0.0"
description = "MediCore HMS AI service — ambient scribe, coding assistant, denial prediction, RAG, voice agent"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "websockets>=14.1",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "numpy>=2.2.1",
    "openai>=1.59.0",
    "anthropic>=0.42.0",
    "langchain>=0.3.13",
    "langchain-openai>=0.2.14",
    "langchain-core>=0.3.28",
    "openai-whisper>=20240930",
    "mlflow>=2.19.0",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
